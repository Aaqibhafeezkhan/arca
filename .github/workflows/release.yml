name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  draft:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check version
        run: |
          VERSION="${TAG#v}"
          grep -q "MARKETING_VERSION: $VERSION\$" App/project.yml || { echo "project.yml ≠ $VERSION"; exit 1; }
          grep -q "\"$VERSION\"" Sources/ArcaKit/Version.swift || { echo "Version.swift ≠ $VERSION"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no $VERSION section"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build app
        run: App/Scripts/build-app.sh dist

      - name: Build CLI (universal)
        run: |
          swift build -c release --arch arm64 --arch x86_64 --product arca
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/arca"
          mkdir -p cli && cp "$BIN" cli/arca && cp LICENSE cli/
          codesign --force --sign - cli/arca
          cli/arca --version

      - name: Package
        run: |
          mkdir -p out dmg
          ditto dist/Arca.app dmg/Arca.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Arca $VERSION" -srcfolder dmg -format UDZO -ov "out/Arca-$VERSION.dmg"
          ditto -c -k --keepParent dist/Arca.app "out/Arca-$VERSION.zip"
          tar -czf "out/arca-cli-$VERSION-macos-universal.tar.gz" -C cli arca LICENSE
          (cd out && shasum -a 256 * > SHA256SUMS.txt)

      - name: Release notes
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          cat .github/release-install.md >> notes.md

      - name: Create draft release
        run: |
          # Re-running replaces an earlier draft, never a published release.
          if DRAFT="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)"; then
            [ "$DRAFT" = "true" ] || { echo "$TAG is already published"; exit 1; }
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" out/* --draft --verify-tag --title "Arca $VERSION" --notes-file notes.md
