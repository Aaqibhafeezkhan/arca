name: Screenshots

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build Arca.app
        run: App/Scripts/build-app.sh dist
      - name: Enlarge display
        continue-on-error: true
        run: |
          brew install displayplacer
          ID=$(displayplacer list | awk '/^Persistent screen id:/ {print $4; exit}')
          for r in 1920x1200 1920x1080 1680x1050 1440x900 1280x800; do
            displayplacer "id:$ID res:$r scaling:off" && { echo "display → $r"; break; }
          done
          system_profiler SPDisplaysDataType | grep -i resolution || true
      - name: Capture
        run: App/Scripts/screenshots.sh dist/Arca.app screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
