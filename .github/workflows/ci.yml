name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    name: ArcaKit (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install libarchive
        run: apt-get update -qq && apt-get install -y -qq libarchive-dev zlib1g-dev zip unzip xz-utils
      - name: Test
        run: swift test

  macos:
    name: ArcaKit + App (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test ArcaKit
        shell: bash
        run: swift test
      - name: Generate Xcode project
        shell: bash
        run: |
          brew install xcodegen xcbeautify
          cd App && xcodegen
      - name: Build app
        shell: bash
        run: |
          cd App
          xcodebuild -project Arca.xcodeproj -scheme Arca -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build | xcbeautify --renderer github-actions
