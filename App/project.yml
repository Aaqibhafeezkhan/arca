# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Arca
options:
  bundleIdPrefix: com.marcovisona
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    # Set your team ID (or override in Xcode) for signing and notarization.
    DEVELOPMENT_TEAM: ""

packages:
  ArcaKit:
    path: ..

targets:
  Arca:
    type: application
    platform: macOS
    sources:
      - path: Arca
    dependencies:
      - package: ArcaKit
        product: ArcaKit
      - target: ArcaQuickLook
    settings:
      base:
        PRODUCT_NAME: Arca
        PRODUCT_BUNDLE_IDENTIFIER: com.marcovisona.Arca
        INFOPLIST_FILE: Config/Arca-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Arca.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        # The 7-Zip embed script downloads (once) and writes into the bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed 7-Zip
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          "$SRCROOT/Scripts/fetch-7zz.sh" "$SRCROOT/Vendor"
          BIN="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/7zz"
          RES="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$SRCROOT/Vendor/7zz" "$BIN"
          mkdir -p "$RES"
          cp "$SRCROOT/Vendor/7-Zip License.txt" "$RES/"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            TS="--timestamp=none"
            [ "$CONFIGURATION" = "Release" ] && [ "$EXPANDED_CODE_SIGN_IDENTITY" != "-" ] && TS="--timestamp"
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime $TS "$BIN"
          fi

  ArcaQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook
    dependencies:
      - package: ArcaKit
        product: ArcaKit
      - sdk: Quartz.framework
    settings:
      base:
        PRODUCT_NAME: ArcaQuickLook
        PRODUCT_BUNDLE_IDENTIFIER: com.marcovisona.Arca.QuickLook
        INFOPLIST_FILE: Config/QuickLook-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/QuickLook.entitlements
        SKIP_INSTALL: YES

schemes:
  Arca:
    build:
      targets:
        Arca: all
    run:
      config: Debug
    archive:
      config: Release
